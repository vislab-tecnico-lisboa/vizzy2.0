amcl:
  ros__parameters:
    use_sim_time: True # Configurable
    alpha1: 0.6
    alpha2: 0.0872
    alpha3: 0.2
    alpha4: 0.2
    base_frame_id: "base_footprint" # Configurable
    global_frame_id: "map" # Configurable
    lambda_short: 0.1
    laser_likelihood_max_dist: 1.0
    laser_max_range: -1.0 # Configurable
    laser_min_range: 0.04
    laser_model_type: "likelihood_field"
    max_beams: 120
    max_particles: 10000
    min_particles: 500
    odom_frame_id: "odometry" # Configurable
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 2
    sigma_hit: 0.2
    transform_tolerance: 0.3
    update_min_a: 0.05 # Configurable
    update_min_d: 0.05 # Configurable
    z_hit: 0.95
    z_max: 0.05
    z_rand: 0.05
    z_short: 0.1
    scan_topic: nav_hokuyo_laser/front/scan # Configurable
    map_topic: /map # Configurable
    set_initial_pose: true
    initial_pose:
      x: 0.0 # Configurable
      y: 0.0 # Configurable
      z: 0.0 # Configurable
      yaw: 0.0 # Configurable
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    beam_skip_distance: 5.0 # Configurable
    beam_skip_error_threshold: 0.5 # Configurable
    beam_skip_threshold: 0.5 # Configurable
    do_beamskip: True # Configurable

bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: "nav2_bt_navigator/default_nav_to_pose.xml" # Configurable
    use_sim_time: True # Configurable
    global_frame: map # Configurable
    robot_base_frame: base_footprint # Configurable
    odom_topic: /odom # Configurable
    bt_loop_duration: 50
    default_server_timeout: 10000
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_lifecycle_manager_bt_node
      - opennav_docking_bt_plugin
    error_code_name_prefixes:
      - assisted_teleop
      - backup
      - compute_path
      - dock_robot
      - drive_on_heading
      - follow_path
      - nav_thru_poses
      - nav_to_pose
      - spin
      - route
      - undock_robot
      - wait

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True # Configurable

controller_server:
  ros__parameters:
    use_sim_time: True # Configurable
    controller_frequency: 20.0 # Configurable
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["mppi_controller_wide", "mppi_controller_narrow", "mppi_controller"]
    odom_topic: /odom # Configurable
    
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.1

    # DWB Parameters.
    # * Use the DWB Local Planner for advanced path following with obstacle avoidance and trajectory evaluation.
    dwb_controller: 
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 0.4
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 2.5
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -2.5
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 30
      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5 # Configurable
      xy_goal_tolerance: 0.35
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02 # * Configurable
      PathAlign.scale: 32.0 # * Configurable
      PathAlign.forward_point_distance: 0.325 # * Configurable
      GoalAlign.scale: 24.0 # * Configurable
      GoalAlign.forward_point_distance: 0.325 # * Configurable
      PathDist.scale: 32.0 # * Configurable
      GoalDist.scale: 24.0 # * Configurable
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 10.0
      RotateToGoal.lookahead_time: -1.0

    # RPP Parameters.
    # * Use the Regulated Pure Pursuit Controller instead of DWB for exact path following with low obstacle avoidance needed.
    rpp_controller: 
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.4
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 3.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      min_distance_to_obstacle: 0.5
      stateful: true

    # MPPI Parameters.
    # * Use the MPPI Controller for advanced path following using an optimization based approach, handling dynamic obstacles and complex environments better than DWB. Computationally more expensive.
    
    # * ---------------------------------------------------------------------
    # * Narrow-Path configuration for MPPI Controller.
    # * ---------------------------------------------------------------------

    mppi_controller_narrow: 
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 64
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.2 # Configurable
      vx_max: 0.8
      vx_min: -0.35
      vy_max: 0.8
      wz_max: 0.6
      ax_max: 3.0
      ax_min: -3.0
      ay_min: -3.0
      ay_max: 3.0
      az_max: 1.5
      iteration_count: 3
      prune_distance: 1.7
      transform_tolerance: 0.1 # Configurable
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      reset_period: 1.0
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0 # Configurable
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: false
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0 # Configurable
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

    # * ---------------------------------------------------------------------
    # * Wide-Path configuration for MPPI Controller.
    # * ---------------------------------------------------------------------

    mppi_controller_wide: 
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 64
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.2 # Configurable
      vx_max: 0.8
      vx_min: -0.35
      vy_max: 0.8
      wz_max: 0.6
      ax_max: 3.0
      ax_min: -3.0
      ay_min: -3.0
      ay_max: 3.0
      az_max: 1.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1 # Configurable
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      reset_period: 1.0
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0 # Configurable
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: false
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0 # Configurable
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

    # * ---------------------------------------------------------------------
    # * General use MPPI Controller for new nav2 Stack (humble_main).
    # * ---------------------------------------------------------------------

    mppi_controller: 
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 64 # Configurable
      model_dt: 0.05
      batch_size: 2000 # Configurable
      vx_std: 0.2 # Configurable
      vy_std: 0.0
      wz_std: 0.4 # Configurable
      vx_max: 0.5 # Configurable
      vx_min: -0.35
      vy_max: 0.0
      wz_max: 1.9
      ax_max: 3.0
      ax_min: -3.0
      ay_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      iteration_count: 1 # Configurable
      prune_distance: 1.7
      transform_tolerance: 0.1 # Configurable
      temperature: 0.3 # Configurable
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      reset_period: 1.0
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
