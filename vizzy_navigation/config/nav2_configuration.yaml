amcl:
  ros__parameters:
    use_sim_time: True # Configurable
    alpha1: 0.6
    alpha2: 0.0872
    alpha3: 0.2
    alpha4: 0.2
    base_frame_id: "base_footprint" # Configurable
    global_frame_id: "map" # Configurable
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: -1.0 # Configurable
    laser_min_range: 0.04
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 5000
    min_particles: 250
    odom_frame_id: "odometry" # Configurable
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.005
    resample_interval: 1
    sigma_hit: 0.2
    transform_tolerance: 0.7
    update_min_a: 0.05 # Configurable
    update_min_d: 0.05 # Configurable
    z_hit: 0.95
    z_max: 0.05
    z_rand: 0.05
    z_short: 0.1
    scan_topic: nav_hokuyo_laser/front/scan # Configurable
    map_topic: /map # Configurable
    set_initial_pose: true
    initial_pose:
      x: 0.0 # Configurable
      y: 0.0 # Configurable
      z: 0.0 # Configurable
      yaw: 0.0 # Configurable
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    beam_skip_distance: 0.5 # Configurable
    beam_skip_error_threshold: 0.9 # Configurable
    beam_skip_threshold: 0.3 # Configurable
    do_beamskip: True # Configurable

