local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true # Configurable
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odometry
      robot_base_frame: base_footprint # Configurable
      use_sim_time: True # Configurable
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.4 # Configurable 
      lethal_cost_threshold: 100
      plugins: ["obstacle_layer", "voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0 # Configurable
        inflation_radius: 0.4 # Configurable
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan_front scan_rear
        
        scan_front:
          topic: /nav_hokuyo_laser/front/scan # Configurable
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0 
          clearing: True
          marking: True
          inf_as_valid: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.75
          obstacle_min_range: 0.04
          observation_persistence: 0.0

        scan_rear:
          topic: /nav_hokuyo_laser/rear/scan # Configurable
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0 
          clearing: True
          marking: True
          inf_as_valid: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.75
          obstacle_min_range: 0.0
          observation_persistence: 0.0

      # Intel RealSense D435 depth cloud -> 3D voxel obstacle marking, so Vizzy
      # sees tabletops/overhangs the ~10 cm lasers miss (they only see legs).
      # LOCAL costmap only (controller avoidance); AMCL and the global plan are
      # unaffected. Inflation stays last in the plugin list.
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True       # RViz debug aid; set False once validated
        origin_z: 0.0
        z_resolution: 0.125           # 16 voxels * 0.125 m = 2.0 m vertical extent
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        observation_sources: realsense_cloud
        realsense_cloud:
          topic: /realsense/depth/color/points   # VERIFY vs the driver: ros2 topic list | grep -i realsense
          data_type: "PointCloud2"
          min_obstacle_height: 0.12   # above floor noise -> ignores the ground
          max_obstacle_height: 1.8    # ~robot height
          obstacle_min_range: 0.3     # D435 minimum reliable depth
          obstacle_max_range: 3.0     # depth trust range (noise grows past this)
          raytrace_min_range: 0.0
          raytrace_max_range: 3.5
          marking: True
          clearing: True
          observation_persistence: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map # Configurable
      robot_base_frame: base_footprint # Configurable
      use_sim_time: True # Configurable
      robot_radius: 0.4 # Configurable
      lethal_cost_threshold: 100
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan_front scan_rear
        scan_front:
          topic: /nav_hokuyo_laser/front/scan # Configurable
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0 
          clearing: True
          marking: True
          inf_as_valid: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.75
          obstacle_min_range: 0.04
          observation_persistence: 0.0

        scan_rear:
          topic: /nav_hokuyo_laser/rear/scan # Configurable
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0 
          clearing: True
          marking: True
          inf_as_valid: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.75
          obstacle_min_range: 0.0
          observation_persistence: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: "map_2" # Configurable
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0 # Configurable
        inflation_radius: 0.4 # Configurable
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True # Configurable
    yaml_filename: "" # Configurable
    topic_name: /map # Configurable
    frame_id: map # Configurable

map_saver:
  ros__parameters:
    use_sim_time: True # Configurable
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0 # Configurable
    use_sim_time: True # Configurable
    planner_plugins: ["GridBased"]

    # NavFn Planner Parameters.
    # Use the NavFn Planner for grid-based path planning with A* or Dijkstra algorithms.
    navfv_planner:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 1.0
      use_astar: false
      allow_unknown: true       

    # Theta* Planner Parameters.
    # Use the Theta* Planner for grid-based path planning with a focus on smooth paths with straight lines (any-angle approach).
    theta_star_planner:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner" 
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      w_heuristic_cost: 1.0

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["SmoothPath"]
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint

    SmoothPath:
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"
      reversing_enabled: false       
      path_downsampling_factor: 1   
      path_upsampling_factor: 2     
      keep_start_orientation: true 
      keep_goal_orientation: true   
      minimum_turning_radius: 0.0
      w_curve: 30.0                 
      w_dist: 0.0                   
      w_smooth: 2000000.0          
      w_cost: 0.015               
      w_cost_cusp_multiplier: 3.0   
      cusp_zone_length: 2.5         

      optimizer:
        max_iterations: 100            
        debug_optimizer: false        
        gradient_tol: 5e3
        fn_tol: 1.0e-15
        param_tol: 1.0e-20

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: map # Configurable
    robot_base_frame: base_footprint # Configurable
    transform_tolerance: 0.5 # Configurable
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.3
    rotational_acc_lim: 3.2
    local_frame: odometry # Configurable

robot_state_publisher:
  ros__parameters:
    use_sim_time: True # Configurable

waypoint_follower:
  ros__parameters:
    use_sim_time: True # Configurable
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True # Configurable
    smoothing_frequency: 30.0
    scale_velocities: False
    feedback: "OPEN_LOOP" # Configurable
    max_velocity: [1.0, 0.0, 0.6]
    min_velocity: [-1.0, 0.0, -0.6]
    max_accel: [1.0, 0.0, 1.0]
    max_decel: [-1.0, 0.0, -1.0]
    odom_topic: "/odom" # Configurable
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True # Configurable
    autostart: True # Configurable
    node_names:
      - map_server
      - amcl
      - planner_server
      - controller_server
      - bt_navigator
      - behavior_server
      - waypoint_follower
      - velocity_smoother

docking_server:
  ros__parameters:
    use_sim_time: True # Configurable
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odometry"
    odom_topic: "odom"
    dock_prestaging_tolerance: 0.5
    introspection_mode: "disabled"

    dock_plugins: ['vizzy_isr_dock']

    docks: ["dock_1"]
    dock_1:
      type: "vizzy_isr_dock"
      frame: "map"
      pose: [0.0, 0.0, 0.0]

    vizzy_isr_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.46
      staging_x_offset: -1.0
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      rotate_to_dock: false

      external_detection_timeout: 5.0
      external_detection_translation_x: 0.0
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
      dock_direction: "backward"

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      v_angular_max: 0.35
      slowdown_radius: 0.25
      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_max_angular_accel: 3.2
      use_collision_detection: false
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint" # Configurable
      transform_tolerance: 0.1 # Configurable
      projection_time: 1.0
      simulation_time_step: 0.1
      dock_collision_threshold: 0.3