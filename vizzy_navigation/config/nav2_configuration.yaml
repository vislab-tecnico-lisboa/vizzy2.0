bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True # Configurable

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True # Configurable

controller_server:
  ros__parameters:
    use_sim_time: True # Configurable
    controller_frequency: 20.0 # Configurable
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: /odom # Configurable
    
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.1

    # DWB Parameters.
    # * Use the DWB Local Planner for advanced path following with obstacle avoidance and trajectory evaluation.
    dwb_controller: 
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 0.4
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 2.5
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -2.5
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 30
      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02 # * Configurable
      PathAlign.scale: 32.0 # * Configurable
      PathAlign.forward_point_distance: 0.325 # * Configurable
      GoalAlign.scale: 24.0 # * Configurable
      GoalAlign.forward_point_distance: 0.325 # * Configurable
      PathDist.scale: 32.0 # * Configurable
      GoalDist.scale: 24.0 # * Configurable
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 10.0
      RotateToGoal.lookahead_time: -1.0

    # RPP Parameters.
    # * Use the Regulated Pure Pursuit Controller instead of DWB for exact path following with low obstacle avoidance needed.
    rpp_controller: 
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.4
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 3.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      min_distance_to_obstacle: 0.5
      stateful: true

    # MPPI Parameters.
    # * Use the MPPI Controller for advanced path following using an optimization based approach, handling dynamic obstacles and complex environments better than DWB. Computationally more expensive.
    mppi_controller: 
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 64
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.2
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 0.6
      ax_max: 3.0
      ax_min: -3.0
      ay_min: -3.0
      ay_max: 3.0
      az_max: 1.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      reset_period: 1.0
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 50.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.2
        near_goal_distance: 0.5
        inflation_radius: 0.4 # Configurable
        cost_scaling_factor: 10.0 # Configurable
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0 # Configurable
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0 # Configurable
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # VelocityDeadbandCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 35.0
      #   deadband_velocities: [0.05, 0.05, 0.05]
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0
  
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map # Configurable
      robot_base_frame: base_footprint # Configurable
      use_sim_time: True # Configurable
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.4 # Configurable 
      lethal_cost_threshold: 100
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0 # Configurable
        inflation_radius: 0.4 # Configurable
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan_front scan_rear
        
        scan_front:
          topic: /nav_hokuyo_laser/front/scan # Configurable
          max_obstacle_height: 2.0
          min_obstacle_height: 0.5
          clearing: True
          marking: True
          inf_as_valid: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.75
          obstacle_min_range: 0.04
          observation_persistence: 0.0

        scan_rear:
          topic: /nav_hokuyo_laser/rear/scan # Configurable
          min_obstacle_height: 0.5
          clearing: True
          marking: True
          inf_as_valid: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.75
          obstacle_min_range: 0.0
          observation_persistence: 0.0

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: "map_2" # Configurable
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map # Configurable
      robot_base_frame: base_footprint # Configurable
      use_sim_time: True # Configurable
      robot_radius: 0.4 # Configurable
      lethal_cost_threshold: 100
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan_front scan_rear
        scan_front:
          topic: /nav_hokuyo_laser/front/scan # Configurable
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          inf_as_valid: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.75
          obstacle_min_range: 0.04
          observation_persistence: 0.0

        scan_rear:
          topic: /nav_hokuyo_laser/rear/scan # Configurable
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          inf_as_valid: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.75
          obstacle_min_range: 0.0
          observation_persistence: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: "map_2" # Configurable
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0 # Configurable
        inflation_radius: 0.4 # Configurable
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True # Configurable
    yaml_filename: "" # Configurable
    topic_name: /map # Configurable
    frame_id: map # Configurable

map_saver:
  ros__parameters:
    use_sim_time: True # Configurable
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0 # Configurable
    use_sim_time: True # Configurable
    planner_plugins: ["GridBased"]

    # NavFn Planner Parameters.
    # Use the NavFn Planner for grid-based path planning with A* or Dijkstra algorithms.
    navfv_planner:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.0
      use_astar: false
      allow_unknown: true       

    # Theta* Planner Parameters.
    # Use the Theta* Planner for grid-based path planning with a focus on smooth paths with straight lines (any-angle approach).
    theta_star_planner:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner" 
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      w_heuristic_cost: 1.0

smoother_server:
  ros__parameters:
    use_sim_time: True # Configurable
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odometry # Configurable
    robot_base_frame: base_footprint # Configurable
    transform_tolerance: 0.5
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.3
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True # Configurable

waypoint_follower:
  ros__parameters:
    use_sim_time: True # Configurable
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True # Configurable
    smoothing_frequency: 30.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 0.6]
    min_velocity: [-0.5, 0.0, -0.6]
    max_accel: [2.5, 0.0, 1.5]
    max_decel: [-2.5, 0.0, -1.5]
    odom_topic: "odometry" # Configurable
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True # Configurable
    autostart: True # Configurable
    node_names:
      - map_server
      - amcl
      - planner_server
      - controller_server
      - bt_navigator
      - behavior_server
      - waypoint_follower
      - velocity_smoother